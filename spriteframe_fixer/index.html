    <meta

      content="纯前端的像素 / 精灵图网格修正与切割工具：自动检测网格、Sobel 边缘对齐、网格采样,所有计算在浏览器本地完成。"
    />
    <title>SpriteFrame Fixer · 像素网格修正 &amp; 精灵图切割</title>
    <script>
      // Resolve the theme before the first paint so the palette never flashes.
      ;(function () {
        try {
          var raw = localStorage.getItem('spf.theme')
          var mode = raw ? JSON.parse(raw) : 'system'
          if (mode !== 'light' && mode !== 'dark') mode = 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (err) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

  </head>
