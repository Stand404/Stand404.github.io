<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <!-- viewport-fit=cover：让内容延伸到系统栏区域，env(safe-area-inset-*) 才可能取到非零值 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>矢量图案变形器</title>
    <script>
      // 首帧前应用主题，避免日/夜间模式切换或刷新时闪白
      (function () {
        try {
          var KEY = 'svg-morph-video:theme'
          var saved = localStorage.getItem(KEY)
          var dark =
            saved === 'dark' ||
            ((saved === 'auto' || !saved) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (_) {
          /* 隐私模式等场景静默回退日间 */
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-BgFfrMov.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-wU3yxHK5.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
